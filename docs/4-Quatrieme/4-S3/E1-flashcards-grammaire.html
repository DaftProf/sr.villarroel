: "jugar → jugando"}, {"s": "3. Gérondif des verbes en -AR", "e": "🚶", "fr": "en train de se promener", "es": "paseando", "h": "Gérondif de « pasear »", "hb": "pasear → paseando"}, {"s": "3. Gérondif des verbes en -AR", "e": "🪑", "fr": "en train de se reposer", "es": "descansando", "h": "Gérondif de « descansar »", "hb": "descansar → descansando"}, {"s": "3. Gérondif des verbes en -AR", "e": "🗣️", "fr": "en train de parler", "es": "hablando", "h": "Gérondif de « hablar »", "hb": "hablar → hablando"}, {"s": "3. Gérondif des verbes en -AR", "e": "💬", "fr": "en train de bavarder", "es": "charlando", "h": "Gérondif de « charlar »", "hb": "charlar → charlando"}, {"s": "3. Gérondif des verbes en -AR", "e": "👶", "fr": "en train de s'occuper de", "es": "cuidando", "h": "Gérondif de « cuidar »", "hb": "cuidar → cuidando"}, {"s": "3. Gérondif des verbes en -AR", "e": "🎁", "fr": "en train d'offrir", "es": "regalando", "h": "Gérondif de « regalar »", "hb": "regalar → regalando"}, {"s": "3. Gérondif des verbes en -AR", "e": "🤲", "fr": "en train de donner", "es": "dando", "h": "Gérondif de « dar »", "hb": "dar → dando"}, {"s": "4. Gérondif des verbes en -ER et -IR", "e": "🥤", "fr": "en train de boire", "es": "bebiendo", "h": "Gérondif de « beber »", "hb": "beber → bebiendo"}, {"s": "4. Gérondif des verbes en -ER et -IR", "e": "✋", "fr": "en train de tenir", "es": "sosteniendo", "h": "Gérondif de « sostener »", "hb": "sostener → sosteniendo"}, {"s": "4. Gérondif des verbes en -ER et -IR", "e": "🫳", "fr": "en train de prendre", "es": "cogiendo", "h": "Gérondif de « coger »", "hb": "coger → cogiendo"}, {"s": "4. Gérondif des verbes en -ER et -IR", "e": "✍️", "fr": "en train d'écrire", "es": "escribiendo", "h": "Gérondif de « escribir »", "hb": "escribir → escribiendo"}, {"s": "5. Gérondifs irréguliers", "e": "📖", "fr": "en train de lire", "es": "leyendo", "h": "Gérondif de « leer » (irrégulier)", "hb": "leer → leyendo (-i- → -y-)"}, {"s": "5. Gérondifs irréguliers", "e": "😴", "fr": "en train de dormir", "es": "durmiendo", "h": "Gérondif de « dormir » (irrégulier)", "hb": "dormir → durmiendo (o → u)"}, {"s": "5. Gérondifs irréguliers", "e": "🙋", "fr": "en train de demander", "es": "pidiendo", "h": "Gérondif de « pedir » (irrégulier)", "hb": "pedir → pidiendo (e → i)"}, {"s": "6. Estar + gérondif", "e": "👀", "fr": "Je suis en train de regarder le tableau.", "es": "Estoy mirando el cuadro.", "h": "", "hb": ""}, {"s": "6. Estar + gérondif", "e": "📖", "fr": "Tu es en train de lire.", "es": "Estás leyendo.", "h": "", "hb": ""}, {"s": "6. Estar + gérondif", "e": "👷", "fr": "Il est en train de travailler.", "es": "Está trabajando.", "h": "", "hb": ""}, {"s": "6. Estar + gérondif", "e": "💬", "fr": "Nous sommes en train de bavarder.", "es": "Estamos charlando.", "h": "", "hb": ""}, {"s": "6. Estar + gérondif", "e": "🥤", "fr": "Vous êtes en train de boire.", "es": "Estáis bebiendo.", "h": "", "hb": ""}, {"s": "6. Estar + gérondif", "e": "🚶", "fr": "Ils sont en train de se promener.", "es": "Están paseando.", "h": "", "hb": ""}, {"s": "7. Sur le tableau de Laura Vidra", "e": "📖", "fr": "Une dame est en train de lire sur le balcon.", "es": "Una señora está leyendo en el balcón.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Sur le tableau de Laura Vidra", "e": "🎁", "fr": "Un homme est en train d'offrir des fleurs.", "es": "Un hombre está regalando flores.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Sur le tableau de Laura Vidra", "e": "🎨", "fr": "Le voisin est en train de peindre dans l'atelier.", "es": "El vecino está pintando en el taller.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Sur le tableau de Laura Vidra", "e": "📦", "fr": "Le vendeur est en train de porter un pot de fleurs.", "es": "El vendedor está llevando una maceta.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Sur le tableau de Laura Vidra", "e": "⚽", "fr": "Les enfants sont en train de jouer sur la place.", "es": "Los niños están jugando en la plaza.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Sur le tableau de Laura Vidra", "e": "🚲", "fr": "Un enfant est en train de faire du vélo.", "es": "Un niño está montando en bicicleta.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Sur le tableau de Laura Vidra", "e": "👵", "fr": "Les grands-parents sont en train de se reposer.", "es": "Los abuelos están descansando.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Sur le tableau de Laura Vidra", "e": "👶", "fr": "Une dame est en train de garder un bébé.", "es": "Una señora está cuidando a un bebé.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Sur le tableau de Laura Vidra", "e": "🛒", "fr": "Une femme est en train d'acheter des fleurs.", "es": "Una mujer está comprando flores.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Sur le tableau de Laura Vidra", "e": "⏱️", "fr": "En ce moment, les voisins sont en train de bavarder.", "es": "En este momento, los vecinos están charlando.", "h": "Avec está ou están", "hb": ""}, {"s": "8. Verbe pronominal", "e": "🛏️", "fr": "Je suis en train de me lever.", "es": "Me estoy levantando. / Estoy levantándome.", "h": "Deux possibilités", "hb": "pronom avant estar OU collé au gérondif (avec accent)"}];
var deck = [], pos = 0, showBack = false, esVoice = null;

function pickVoice(){
  if(!window.speechSynthesis) return;
  var v = speechSynthesis.getVoices(), pref = ["es-ES","es-MX","es-US","es-419"];
  for(var p=0;p<pref.length;p++){
    for(var i=0;i<v.length;i++){ if(v[i].lang.replace("_","-")===pref[p]){ esVoice=v[i]; return; } }
  }
  for(var j=0;j<v.length;j++){ if(v[j].lang.toLowerCase().indexOf("es")===0){ esVoice=v[j]; return; } }
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function speak(t){
  if(!window.speechSynthesis) return;
  if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
  var clean = t.replace(/\s*[\/→=]\s*/g, ", ").replace(/[«»—]/g, "");
  var u = new SpeechSynthesisUtterance(clean);
  u.lang = esVoice ? esVoice.lang : "es-ES";
  if(esVoice) u.voice = esVoice;
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function buildFilter(){
  var f = document.getElementById("filter"), seen = [];
  f.innerHTML = '<option value="">📚 Toutes les cartes ('+CARDS.length+')</option>';
  CARDS.forEach(function(c){ if(seen.indexOf(c.s)<0) seen.push(c.s); });
  seen.forEach(function(s){
    var n = CARDS.filter(function(c){return c.s===s;}).length;
    var o = document.createElement("option"); o.value = s; o.textContent = s+" ("+n+")"; f.appendChild(o);
  });
}
function resetDeck(){
  var s = document.getElementById("filter").value;
  deck = CARDS.filter(function(c){ return !s || c.s===s; });
  pos = 0; showBack = false; render();
}
function render(){
  var c = deck[pos], card = document.getElementById("card");
  document.getElementById("count").textContent = "Carte "+(pos+1)+" / "+deck.length;
  document.getElementById("sec").textContent = c.s;
  document.getElementById("emoji").textContent = c.e;
  if(showBack){
    card.className = "back";
    document.getElementById("text").textContent = c.es;
    document.getElementById("hint").textContent = c.hb || "";
    document.getElementById("side").textContent = "🇪🇸 Español";
  } else {
    card.className = "";
    document.getElementById("text").textContent = c.fr;
    document.getElementById("hint").textContent = c.h || "";
    document.getElementById("side").textContent = "🇫🇷 Français";
  }
}
function flip(){
  var card = document.getElementById("card");
  card.classList.add("flip");
  var toBack = !showBack; if(toBack) speak(deck[pos].es); /* iPad/iPhone : la voix doit partir directement au toucher */
  setTimeout(function(){ showBack = toBack; render(); }, 140);
}
function go(d){ pos = (pos + d + deck.length) % deck.length; showBack = false; if(window.speechSynthesis) speechSynthesis.cancel(); render(); }

document.getElementById("card").addEventListener("click", flip);
document.getElementById("next").addEventListener("click", function(){ go(1); });
document.getElementById("prev").addEventListener("click", function(){ go(-1); });
document.getElementById("listen").addEventListener("click", function(){ if(!showBack){ showBack = true; render(); } speak(deck[pos].es); });
document.getElementById("filter").addEventListener("change", resetDeck);
document.getElementById("order").addEventListener("click", resetDeck);
document.getElementById("shuffle").addEventListener("click", function(){
  for(var i=deck.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=deck[i]; deck[i]=deck[j]; deck[j]=t; }
  pos = 0; showBack = false; render();
});
document.addEventListener("keydown", function(e){
  if(e.target.tagName==="SELECT") return;
  if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); }
  else if(e.key==="ArrowRight") go(1);
  else if(e.key==="ArrowLeft") go(-1);
});
var sx = null;
document.getElementById("card").addEventListener("touchstart", function(e){ sx = e.changedTouches[0].clientX; }, {passive:true});
document.getElementById("card").addEventListener("touchend", function(e){
  if(sx===null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
  if(Math.abs(dx) > 50){ e.preventDefault(); go(dx < 0 ? 1 : -1); }
});
buildFilter(); resetDeck();
</script>
