 de « vivir »", "hb": "vivir → viviendo"}, {"s": "6. Gérondifs irréguliers", "e": "👀", "fr": "en train de voir, de regarder", "es": "viendo", "h": "Gérondif de « ver » (irrégulier)", "hb": "ver → viendo"}, {"s": "6. Gérondifs irréguliers", "e": "🌧️", "fr": "en train de pleuvoir", "es": "lloviendo", "h": "Gérondif de « llover » (irrégulier)", "hb": "llover → lloviendo"}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "🏊", "fr": "Ils sont en train de nager dans la piscine.", "es": "Están nadando en la piscina.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "👶", "fr": "Ils sont en train de se promener avec un bébé et un chien.", "es": "Están paseando con un bebé y un perro.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "🏀", "fr": "Ils sont en train de jouer au basket.", "es": "Están jugando al baloncesto.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "📺", "fr": "Il est en train de parler pour la télévision.", "es": "Está hablando para la televisión.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "🧸", "fr": "La fille est en train de serrer un ours dans ses bras.", "es": "La chica está abrazando a un oso.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "⚔️", "fr": "Ils sont en train de se battre avec des épées.", "es": "Están luchando con espadas.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "🌱", "fr": "Il est en train de couper le gazon.", "es": "Está cortando el césped.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "🧽", "fr": "Elle est en train de nettoyer la poussière.", "es": "Está limpiando el polvo.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "🎶", "fr": "Ils sont en train de chanter et de danser.", "es": "Están cantando y bailando.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "😢", "fr": "Elle est en train de pleurer parce qu'elle est très triste.", "es": "Está llorando porque está muy triste.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "🎓", "fr": "Elle est en train d'étudier à l'université.", "es": "Está estudiando en la universidad.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "🍂", "fr": "C'est l'automne et il est en train de pleuvoir beaucoup.", "es": "Es otoño y está lloviendo mucho.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "🐶", "fr": "Le chien est en train de boire de l'eau.", "es": "El perro está bebiendo agua.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "🍌", "fr": "Il est en train de manger une banane.", "es": "Está comiendo un plátano.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "📸", "fr": "Elle est en train de prendre des photos des fleurs.", "es": "Está haciendo fotos a las flores.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "🏃", "fr": "Ils sont en train de courir dans la rue.", "es": "Están corriendo por la calle.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "🎾", "fr": "Ils sont en train de regarder un match de tennis.", "es": "Están viendo un partido de tenis.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "💻", "fr": "Il est en train d'écrire avec l'ordinateur.", "es": "Está escribiendo con el ordenador.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "👏", "fr": "Les spectateurs sont en train d'applaudir.", "es": "Los espectadores están aplaudiendo.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "🚗", "fr": "Il est en train de conduire sur l'autoroute.", "es": "Está conduciendo por la autopista.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "🪜", "fr": "Ils sont en train de monter les escaliers.", "es": "Están subiendo las escaleras.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "🚉", "fr": "Ils sont en train de sortir de la gare.", "es": "Están saliendo de la estación de tren.", "h": "Avec está ou están", "hb": ""}, {"s": "7. Dans la vidéo : ¿qué están haciendo?", "e": "🇬🇧", "fr": "Mon frère est en train de vivre à Londres.", "es": "Mi hermano está viviendo en Londres.", "h": "Avec está ou están", "hb": ""}];
var deck = [], pos = 0, showBack = false, esVoice = null;

function pickVoice(){
  if(!window.speechSynthesis) return;
  var v = speechSynthesis.getVoices(), pref = ["es-ES","es-MX","es-US","es-419"];
  for(var p=0;p<pref.length;p++){
    for(var i=0;i<v.length;i++){ if(v[i].lang.replace("_","-")===pref[p]){ esVoice=v[i]; return; } }
  }
  for(var j=0;j<v.length;j++){ if(v[j].lang.toLowerCase().indexOf("es")===0){ esVoice=v[j]; return; } }
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function speak(t){
  if(!window.speechSynthesis) return;
  if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
  var clean = t.replace(/\s*[\/→=]\s*/g, ", ").replace(/[«»—]/g, "");
  var u = new SpeechSynthesisUtterance(clean);
  u.lang = esVoice ? esVoice.lang : "es-ES";
  if(esVoice) u.voice = esVoice;
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function buildFilter(){
  var f = document.getElementById("filter"), seen = [];
  f.innerHTML = '<option value="">📚 Toutes les cartes ('+CARDS.length+')</option>';
  CARDS.forEach(function(c){ if(seen.indexOf(c.s)<0) seen.push(c.s); });
  seen.forEach(function(s){
    var n = CARDS.filter(function(c){return c.s===s;}).length;
    var o = document.createElement("option"); o.value = s; o.textContent = s+" ("+n+")"; f.appendChild(o);
  });
}
function resetDeck(){
  var s = document.getElementById("filter").value;
  deck = CARDS.filter(function(c){ return !s || c.s===s; });
  pos = 0; showBack = false; render();
}
function render(){
  var c = deck[pos], card = document.getElementById("card");
  document.getElementById("count").textContent = "Carte "+(pos+1)+" / "+deck.length;
  document.getElementById("sec").textContent = c.s;
  document.getElementById("emoji").textContent = c.e;
  if(showBack){
    card.className = "back";
    document.getElementById("text").textContent = c.es;
    document.getElementById("hint").textContent = c.hb || "";
    document.getElementById("side").textContent = "🇪🇸 Español";
  } else {
    card.className = "";
    document.getElementById("text").textContent = c.fr;
    document.getElementById("hint").textContent = c.h || "";
    document.getElementById("side").textContent = "🇫🇷 Français";
  }
}
function flip(){
  var card = document.getElementById("card");
  card.classList.add("flip");
  var toBack = !showBack; if(toBack) speak(deck[pos].es); /* iPad/iPhone : la voix doit partir directement au toucher */
  setTimeout(function(){ showBack = toBack; render(); }, 140);
}
function go(d){ pos = (pos + d + deck.length) % deck.length; showBack = false; if(window.speechSynthesis) speechSynthesis.cancel(); render(); }

document.getElementById("card").addEventListener("click", flip);
document.getElementById("next").addEventListener("click", function(){ go(1); });
document.getElementById("prev").addEventListener("click", function(){ go(-1); });
document.getElementById("listen").addEventListener("click", function(){ if(!showBack){ showBack = true; render(); } speak(deck[pos].es); });
document.getElementById("filter").addEventListener("change", resetDeck);
document.getElementById("order").addEventListener("click", resetDeck);
document.getElementById("shuffle").addEventListener("click", function(){
  for(var i=deck.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=deck[i]; deck[i]=deck[j]; deck[j]=t; }
  pos = 0; showBack = false; render();
});
document.addEventListener("keydown", function(e){
  if(e.target.tagName==="SELECT") return;
  if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); }
  else if(e.key==="ArrowRight") go(1);
  else if(e.key==="ArrowLeft") go(-1);
});
var sx = null;
document.getElementById("card").addEventListener("touchstart", function(e){ sx = e.changedTouches[0].clientX; }, {passive:true});
document.getElementById("card").addEventListener("touchend", function(e){
  if(sx===null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
  if(Math.abs(dx) > 50){ e.preventDefault(); go(dx < 0 ? 1 : -1); }
});
buildFilter(); resetDeck();
</script>
