<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>¡Español con el profe!</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="entete">
    <a href="#/" class="logo">
      <img src="images/logo.png" class="logo-img" alt="">
      <span>
        <span class="logo-titre" id="site-titre">¡Español con el profe!</span>
        <span class="logo-sous" id="site-sous"></span>
      </span>
    </a>
    <nav class="liens-externes" id="liens-externes"></nav>
  </header>
  <a href="#/" class="banniere" id="banniere"><img src="images/image.png" alt="¡Español con el profe! Les cours d'espagnol de M. Villarroel"></a>
  <!-- Drapeaux des 21 pays hispanophones (images) -->
  <div class="banderas" aria-label="Pays hispanophones">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/es.svg" alt="España" title="España" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/ve.svg" alt="Venezuela" title="Venezuela" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/mx.svg" alt="México" title="México" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/gt.svg" alt="Guatemala" title="Guatemala" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/hn.svg" alt="Honduras" title="Honduras" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/sv.svg" alt="El Salvador" title="El Salvador" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/ni.svg" alt="Nicaragua" title="Nicaragua" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/cr.svg" alt="Costa Rica" title="Costa Rica" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/pa.svg" alt="Panamá" title="Panamá" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/cu.svg" alt="Cuba" title="Cuba" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/do.svg" alt="República Dominicana" title="República Dominicana" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/pr.svg" alt="Puerto Rico" title="Puerto Rico" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/co.svg" alt="Colombia" title="Colombia" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/ec.svg" alt="Ecuador" title="Ecuador" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/pe.svg" alt="Perú" title="Perú" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/bo.svg" alt="Bolivia" title="Bolivia" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/cl.svg" alt="Chile" title="Chile" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/ar.svg" alt="Argentina" title="Argentina" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/uy.svg" alt="Uruguay" title="Uruguay" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/py.svg" alt="Paraguay" title="Paraguay" width="32" height="24">
    <img src="https://cdn.jsdelivr.net/npm/flag-icons@7.6.0/flags/4x3/gq.svg" alt="Guinea Ecuatorial" title="Guinea Ecuatorial" width="32" height="24">
  </div>

  <nav class="fil" id="fil" aria-label="Fil d'Ariane"></nav>
  <main id="app" class="contenu"></main>

  <footer class="pied">
    <span>Hecho con ❤️ para mis alumnos</span>
    <button class="btn-lien" id="btn-deconnexion" hidden>🔒 Verrouiller les niveaux</button>
  </footer>

  <script src="sha256.js"></script>
  <script src="contenu.js"></script>
  <script src="app.js"></script>
  <!-- Compteur de visites (GoatCounter, sans cookie) : statistiques sur https://sr-villarroel.goatcounter.com -->
  <script data-goatcounter="https://sr-villarroel.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  <script>
    // La grande bannière ne s'affiche que sur la page d'accueil
    function majBanniere() { var b = document.getElementById("banniere"); if (b) b.style.display = (location.hash.replace(/^#\/?/, "") === "") ? "" : "none"; }
    window.addEventListener("hashchange", majBanniere); majBanniere();
  </script>
</body>
</html>
